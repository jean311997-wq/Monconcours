<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Concours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#0F1513;
  --ardoise:#18211E;
  --ardoise2:#212C27;
  --trait:#2E3B35;
  --craie:#EDEAE1;
  --craie2:#A3B0AA;
  --papier:#EFE9DA;
  --papier2:#E2D9C2;
  --papier-trait:#C3B694;
  --laterite:#C4552E;
  --cachet:#0E7A54;
  --or:#CE9F2F;
  --survol:#4A5C55;
  --vert-fond:#0F241C; --vert-bord:#1D5442; --vert-texte:#4FC28F; --vert-plein:#14503B;
  --rouge-fond:#20110B; --rouge-bord:#5A2E1D; --rouge-texte:#E28460; --rouge-plein:#3A1B10;
  --ambre-fond:#221D0F; --ambre-bord:#4E4222; --ambre-texte:#C9A94A;
  --or-fond:#241F10; --or-texte:#D9CFB4; --or-bord:#3A3520; --or-encre:#1A1405;
  --ombre:0 30px 70px -20px rgba(0,0,0,.7);
  --d:'Bricolage Grotesque',system-ui,sans-serif;
  --b:'IBM Plex Sans',system-ui,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,monospace;
  --barre:#111917;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#080B0A;color:var(--craie);font-family:var(--b);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:28px 20px 60px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .1s ease, filter .15s ease, background-color .18s ease, border-color .18s ease}
button:active:not([disabled]){transform:scale(.975)}
.rep:active:not([disabled]),.pastille-op:active:not([disabled]){transform:scale(.93)}
.nav button:active,.rail button:active{transform:scale(.94)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* ---------- MISE EN PAGE ---------- */
html,body{height:100%}
body{background:var(--encre);padding:0;overflow:hidden}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--encre)}
.rail{display:none}
.vue{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vue::-webkit-scrollbar{width:8px}
.vue::-webkit-scrollbar-thumb{background:var(--trait);border-radius:4px}
.vue:focus{outline:none}
.pad{padding:16px 18px 40px;max-width:760px;margin:0 auto;width:100%}
.hero,.qzone,.copie,.diag{max-width:760px;margin:0 auto;width:100%}

/* tablette et ordinateur : rail latéral, colonne centrée */
@media(min-width:860px){
  .app{display:grid;grid-template-columns:262px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .apptete{grid-column:1 / -1}
  .rail{display:flex;flex-direction:column;gap:3px;padding:20px 14px;
    border-right:1px solid var(--trait);overflow-y:auto;background:var(--barre)}
  .rail button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px;
    border-radius:11px;font-size:14px;color:var(--craie2);transition:.14s}
  .rail button .g{display:grid;place-items:center;width:22px}
  .rail button:hover{background:var(--ardoise);color:var(--craie)}
  .rail button.on{background:var(--ardoise2);color:var(--craie);font-weight:600}
  .rail button.on .g{color:var(--laterite)}
  .rail button .g svg{display:block}
  .rail .pastille{margin-left:auto;background:var(--laterite);color:#fff;font-family:var(--m);
    font-size:10px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
  .rail .bas{margin-top:auto;padding-top:16px;border-top:1px solid var(--trait);font-size:11.5px;
    color:var(--craie2);line-height:1.5}
  .nav{display:none !important}
  .pad{padding:26px 34px 60px}
  .hero{padding:34px 34px 40px}
  .qzone{padding:26px 34px 50px}
  .copie{padding:30px 34px 50px}
  h2.titre{font-size:32px}
  .serment{font-size:46px}
  .qtexte{font-size:24px}
  .opt{font-size:15px;padding:14px 15px}
  .gr-tete,.gr-consigne,.gr-pied,.gr-corps{padding-left:max(18px,calc((100% - 820px)/2));padding-right:max(18px,calc((100% - 820px)/2))}
  .gr-corps.avec-scrub{padding-right:max(56px,calc((100% - 820px)/2))}
  .gr-q .tx{font-size:15px}
  .bulle{width:40px;height:29px}
  .deux-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
}
@media(min-width:1280px){
  .app{grid-template-columns:288px minmax(0,1fr)}
  .pad{padding:32px 40px 70px}
}

/* ---------- NAV ---------- *//* ---------- NAV ---------- */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--trait);
  background:var(--barre);padding:7px 4px calc(10px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;
  letter-spacing:.03em;color:var(--craie2);padding:4px 0;position:relative}
.nav button .g{display:grid;place-items:center;height:20px}
.nav button.on{color:var(--craie)}
.nav button.on::before{content:'';position:absolute;top:-8px;width:22px;height:2px;background:var(--laterite)}
.nav .pastille{position:absolute;top:0;right:calc(50% - 20px);background:var(--laterite);color:#fff;
  font-family:var(--m);font-size:8.5px;min-width:14px;height:14px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

/* ---------- BLOCS ---------- */
.eyebrow{font-family:var(--m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--craie2)}
h2.titre{font-family:var(--d);font-weight:800;font-size:25px;line-height:1.05;letter-spacing:-.025em;margin:6px 0 3px}
.sous{color:var(--craie2);font-size:14px;line-height:1.55}
.carte{background:var(--ardoise);border:1px solid var(--trait);border-radius:14px;padding:14px}
.carte+.carte{margin-top:10px}
.bloc{margin-top:22px}
.libelle{font-family:var(--m);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--craie2);margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.cta{width:100%;background:var(--laterite);color:#fff;font-weight:600;font-size:14.5px;border-radius:11px;
  padding:14px;text-align:center;transition:transform .12s,filter .12s}
.cta:hover{filter:brightness(1.09)}.cta:active{transform:scale(.985)}
.cta.vert{background:var(--cachet)}
.cta.creux{background:none;border:1px solid var(--trait);color:var(--craie)}
.cta small{display:block;font-weight:400;font-size:11px;opacity:.72;margin-top:3px;font-family:var(--m)}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}

/* tampons */
.tampon{display:inline-flex;align-items:center;gap:5px;font-family:var(--m);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
.t-ok{color:var(--vert-texte);border-color:var(--vert-bord);background:var(--vert-fond)}
.t-att{color:var(--ambre-texte);border-color:var(--ambre-bord);background:var(--ambre-fond)}
.t-feu{color:var(--rouge-texte);border-color:var(--rouge-bord);background:var(--rouge-fond)}

/* ---------- DIAGNOSTIC ---------- */
.diag{padding:26px 20px}
.progression{display:flex;gap:5px;margin-bottom:26px}
.progression i{height:3px;flex:1;background:var(--trait);border-radius:2px;transition:background .35s ease, flex .45s cubic-bezier(.2,.8,.3,1)}
.progression i.on{background:var(--laterite)}
.choix{display:block;width:100%;text-align:left;background:var(--ardoise);border:1px solid var(--trait);
  border-radius:12px;padding:13px 14px;margin-bottom:9px;transition:border-color .15s,background .15s}
.choix:hover{border-color:var(--survol);background:var(--ardoise2)}
.choix b{display:block;font-size:14.5px;font-weight:600}
.choix span{display:block;font-size:11.5px;color:var(--craie2);margin-top:2px}

.marquehero{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.marquehero .mot{font-family:var(--d);font-weight:800;font-size:17px;letter-spacing:.01em}
.marquehero .mot i{font-style:normal;color:var(--laterite)}
.marquehero .devise{font-size:11.5px;color:var(--craie2);margin-top:2px}

/* ---------- NOTE DE COPIE ---------- */
.bloc-note{display:flex;align-items:center;gap:18px;margin:6px 0 4px}
.marque-note{flex:none;display:flex;align-items:baseline;justify-content:center;gap:1px;
  border:3px solid var(--laterite);border-radius:50%;width:104px;height:78px;
  transform:rotate(-5deg);color:var(--laterite);position:relative}
.marque-note::after{content:'';position:absolute;inset:-5px -7px;border:1.5px solid var(--laterite);
  border-radius:50%;opacity:.35;transform:rotate(3deg)}
.marque-note.ok{border-color:var(--cachet);color:var(--cachet)}
.marque-note.ok::after{border-color:var(--cachet)}
.marque-note .v{font-family:var(--d);font-weight:800;font-size:42px;letter-spacing:-.04em;line-height:1}
.marque-note .d{font-family:var(--d);font-weight:700;font-size:19px;opacity:.75}
.note-legende .l1{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--craie2)}
.note-legende .l2{font-size:15px;font-weight:600;margin:5px 0 6px;line-height:1.3}
.note-legende .l3{display:inline-block;font-family:var(--m);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--rouge-texte);border:1px solid var(--rouge-bord);
  background:var(--rouge-fond);border-radius:5px;padding:3px 8px}
.note-legende .l3.ok{color:var(--vert-texte);border-color:var(--vert-bord);background:var(--vert-fond)}

.echelle{margin-top:20px;border:1px solid var(--trait);border-radius:13px;padding:14px;background:var(--ardoise)}
.ec-tete{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--craie2);margin-bottom:12px}
.ec-tete .num{color:var(--craie);font-size:14px}
.echelle .barre-seuil{margin:0 0 6px;height:14px}
.echelle .barre-seuil .rail{top:4px}
.echelle .barre-seuil .moi{top:4px}
.echelle .barre-seuil .seuil{top:0;height:14px}
.ec-pied{position:relative;height:30px;font-family:var(--m);font-size:10.5px;color:var(--craie2)}
.ec-pied .num{position:absolute;top:0}
.ec-pied .num:first-child{left:0}
.ec-pied .num:last-child{right:0}
.ec-pied .marqueur{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;
  color:var(--or);font-size:10px;text-align:center;max-width:190px}
@media(max-width:400px){.ec-pied .marqueur{font-size:9.5px}}

/* ---------- ENGAGEMENT / RÉSULTAT ---------- */
.hero{display:block;padding:20px 22px 34px}
.serment{font-family:var(--d);font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.035em}
.serment em{font-style:normal;color:var(--laterite)}
.hero-texte{color:var(--craie2);font-size:14.5px;line-height:1.55;margin-top:14px}
.compteur-place{border:1px solid var(--trait);border-radius:12px;padding:12px 13px;margin-top:20px;
  display:flex;align-items:center;gap:12px;background:var(--ardoise)}
.compteur-place .gros{font-family:var(--d);font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--or);line-height:1}
.compteur-place p{font-size:11.5px;color:var(--craie2);line-height:1.45}
.reveal{animation:monte .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pastille-etape{font-family:var(--m);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--craie2)}
.domaine{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--trait)}
.domaine:last-child{border-bottom:none}
.domaine .n{flex:1;font-size:14px}
.domaine .pts{display:flex;gap:3px}
.domaine .pts i{width:9px;height:9px;border-radius:50%;background:var(--trait)}
.domaine .pts i.j{background:var(--cachet)}
.domaine .pts i.f{background:var(--laterite)}
.verdict{border-radius:13px;border:1px solid;padding:16px;margin-top:16px;line-height:1.6;font-size:14.5px}
.verdict.solide{border-color:var(--vert-bord);background:var(--vert-fond)}
.verdict.fragile{border-color:var(--rouge-bord);background:var(--rouge-fond)}
.verdict b{display:block;font-family:var(--d);font-weight:700;font-size:16px;margin-bottom:6px;letter-spacing:-.01em}
.bonne-nouvelle{border-left:2px solid var(--or);padding-left:13px;margin-top:20px}
.bonne-nouvelle h4{font-family:var(--d);font-weight:700;font-size:17px;letter-spacing:-.02em;margin-bottom:5px}
.bonne-nouvelle p{font-size:12.5px;color:var(--craie2);line-height:1.55}

.tete-jour{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.pastille-j{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--m);font-size:10px;
  letter-spacing:.04em;color:var(--craie2);border:1px solid var(--trait);background:var(--ardoise);
  border-radius:20px;padding:5px 11px;white-space:nowrap}
.pastille-j b{font-family:var(--d);font-weight:800;font-size:13px;color:var(--laterite);letter-spacing:-.02em}
.sous-titre{font-size:13.5px;color:var(--craie2);margin-top:5px}
@media(max-width:360px){.pastille-j{font-size:9px;padding:4px 9px}}

.ligne-direct{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:7px}
.direct{display:inline-flex;align-items:center;gap:7px;font-family:var(--m);font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--laterite)}
.direct i{width:8px;height:8px;border-radius:50%;background:var(--laterite);
  box-shadow:0 0 0 0 rgba(196,85,46,.6);animation:pulseDirect 1.8s ease-out infinite}
@keyframes pulseDirect{0%{box-shadow:0 0 0 0 rgba(196,85,46,.65)}70%{box-shadow:0 0 0 10px rgba(196,85,46,0)}100%{box-shadow:0 0 0 0 rgba(196,85,46,0)}}
.ligne-direct .sous-titre{margin-top:0}

.bandeau-actu{overflow:hidden;border-top:1px solid var(--trait);border-bottom:1px solid var(--trait);
  padding:7px 0;margin-bottom:12px;background:var(--ardoise)}
.bandeau-actu span{display:inline-block;white-space:nowrap;font-family:var(--m);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--craie2);padding-left:100%;
  animation:defileActu 26s linear infinite}
@keyframes defileActu{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.tag-neuf{display:inline-block;font-family:var(--m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--laterite);color:#fff;border-radius:4px;padding:3px 7px;margin-left:5px;
  animation:clignoteNeuf 1.7s ease-in-out infinite}
@keyframes clignoteNeuf{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- REPRISE DE COMPOSITION ---------- */
.reprise-compo{display:block;width:100%;text-align:left;border:1.5px solid var(--laterite);
  background:var(--rouge-fond);border-radius:15px;padding:16px;margin:18px 0 4px;transition:transform .12s}
.reprise-compo:active{transform:scale(.99)}
.rc-tete{font-family:var(--m);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rouge-texte)}
.rc-sujet{font-family:var(--d);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:7px 0 4px}
.rc-nb{font-size:13px;color:var(--craie2)}
.rc-cta{display:inline-flex;align-items:center;gap:8px;margin-top:13px;background:var(--laterite);
  color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:9px}

/* ---------- BULLETIN ---------- */
.info{border-left:2px solid var(--trait);padding:2px 0 2px 13px;margin-bottom:18px}
.info h4{font-size:16px;font-weight:600;line-height:1.35;margin:7px 0 5px}
.info p{font-size:14px;color:var(--craie2);line-height:1.55}
.info.ok{border-color:var(--cachet)}
.info.att{border-color:var(--ambre-bord)}

/* ---------- MATIÈRES ---------- */
.mat{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--trait)}
.mat:last-child{border-bottom:none}
.mat .nom{flex:1;font-size:14px}
.mat .nom em{display:block;font-style:normal;font-size:12px;color:var(--craie2);font-family:var(--m);margin-top:2px}
.jauge{width:74px;height:4px;background:var(--trait);border-radius:2px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--craie2);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.jauge.bas i{background:var(--laterite)}
.jauge.haut i{background:var(--cachet)}
.mat .val{font-family:var(--m);font-size:13px;width:36px;text-align:right}

/* ---------- ÉTAPES ---------- */
.etape{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--trait);align-items:flex-start}
.etape:last-child{border-bottom:none}
.puce{width:21px;height:21px;flex:none;border-radius:50%;border:1px solid var(--trait);display:grid;place-items:center;
  font-family:var(--m);font-size:10px;color:var(--craie2);margin-top:1px}
.etape.fait .puce{background:var(--cachet);border-color:var(--cachet);color:#fff}
.etape.actif .puce{border-color:var(--laterite);color:var(--laterite)}
.etape h5{font-size:13.5px;font-weight:600}
.etape p{font-size:11.5px;color:var(--craie2);margin-top:2px;line-height:1.45}
.etape .dur{font-family:var(--m);font-size:10px;color:var(--craie2);margin-top:4px;display:block}
.etape.fait h5{color:var(--craie2);text-decoration:line-through;text-decoration-color:var(--trait)}

/* ---------- SÉANCE ---------- */
.qzone{padding:18px}
.qmeta{display:flex;justify-content:space-between;font-family:var(--m);font-size:10px;color:var(--craie2);letter-spacing:.06em;margin-bottom:16px}
.qtexte{font-family:var(--d);font-weight:700;font-size:20px;line-height:1.25;letter-spacing:-.02em;margin-bottom:18px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--ardoise);
  border:1px solid var(--trait);border-radius:11px;padding:12px 13px;margin-bottom:8px;font-size:13.5px;transition:.15s}
.opt .lettre{font-family:var(--m);font-size:11px;width:20px;height:20px;flex:none;border:1px solid var(--trait);
  border-radius:50%;display:grid;place-items:center;color:var(--craie2)}
.opt:hover{border-color:var(--survol)}
.opt.juste{border-color:var(--cachet);background:var(--vert-fond)}
.opt.juste .lettre{background:var(--cachet);border-color:var(--cachet);color:#fff}
.opt.faux{border-color:var(--laterite);background:var(--rouge-fond)}
.opt.faux .lettre{background:var(--laterite);border-color:var(--laterite);color:#fff}
.opt[disabled]{cursor:default}
.retour{border-radius:12px;padding:13px;font-size:13.5px;line-height:1.55;margin-top:12px;border:1px solid;
  animation:apparait .32s cubic-bezier(.2,.8,.3,1) both}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.retour.mal{animation:apparait .32s cubic-bezier(.2,.8,.3,1) both, attention 1.1s .3s ease-in-out 2}
@keyframes attention{0%,100%{border-color:var(--rouge-bord)}50%{border-color:var(--laterite)}}
.opt.juste{animation:pulseJuste .5s ease-out}
@keyframes pulseJuste{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}
.opt.faux{animation:secousse .34s ease-in-out}
@keyframes secousse{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.retour.bien{border-color:var(--vert-bord);background:var(--vert-fond)}
.retour.mal{border-color:var(--rouge-bord);background:var(--rouge-fond)}
.retour b{display:block;font-size:12px;margin-bottom:4px;font-family:var(--m);letter-spacing:.06em;text-transform:uppercase}

.grille{background:var(--papier);color:#221F17;min-height:100%;display:flex;flex-direction:column;position:relative}
.scrub{position:absolute;right:8px;top:14%;height:72%;width:30px;z-index:4;touch-action:none;
  display:flex;justify-content:center}
.scrub .rail-s{width:6px;height:100%;background:var(--papier2);border:1px solid var(--papier-trait);

.cours .ic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--ardoise2);display:grid;place-items:center;font-size:16px}
.cours .co{flex:1;min-width:0}
.cours .co b{display:block;font-size:13.5px;font-weight:600}
.cours .bar{height:4px;background:var(--trait);border-radius:2px;margin-top:7px;overflow:hidden}
.cours .bar i{display:block;height:100%;background:var(--cachet);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.cours .pc{font-family:var(--m);font-size:11px;color:var(--craie2);margin-top:5px;display:block}
.cours .fl{font-family:var(--m);font-size:10px;color:var(--craie2);flex:none;text-align:right}

.bandeau-niveau{display:flex;align-items:center;gap:10px;justify-content:space-between;
  background:var(--ardoise2);border:1px solid var(--trait);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.bandeau-niveau b{display:block;font-size:12.5px;font-weight:600}
.bandeau-niveau span{font-size:11.5px;color:var(--craie2)}
.cours .ic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--ardoise2);border:1px solid var(--trait);
  display:grid;place-items:center;font-family:var(--m);font-size:12px;font-weight:600;color:var(--craie2);letter-spacing:.04em}
.fascicule{background:var(--ardoise);border:1px solid var(--trait);border-radius:13px;padding:13px;margin-bottom:9px}
.fascicule .ligne1{display:flex;align-items:center;gap:11px}
.fascicule .ic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--ardoise2);border:1px solid var(--trait);
  display:grid;place-items:center;font-family:var(--m);font-size:12px;font-weight:600;color:var(--craie2)}
.fascicule .co{flex:1;min-width:0}
.fascicule .co b{display:block;font-size:13.5px;font-weight:600}
.fascicule .co span{font-size:11.5px;color:var(--craie2)}
.fascicule .cad{margin-left:auto;color:var(--craie2)}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.mini{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--trait);
  border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;color:var(--craie);width:100%}
.mini:hover{border-color:var(--survol);background:var(--ardoise2)}
.mini.bloquee{margin-top:11px;color:var(--craie2)}
.fascicule.verrou{opacity:.62}

/* ---------- QCM ---------- */
.qcm-tete{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.qcm-tete .q{font-family:var(--m);font-size:10.5px;letter-spacing:.08em;color:var(--craie2)}
.qcm-tete .x{font-family:var(--m);font-size:14px;color:var(--craie2)}
.motiv{border:1px solid var(--or);background:var(--or-fond);border-radius:13px;padding:14px;margin-top:14px}
.motiv b{display:block;font-family:var(--d);font-weight:700;font-size:16px;color:var(--or);margin-bottom:4px}
.motiv p{font-size:12.5px;color:var(--or-texte);line-height:1.5}

/* ---------- COLLECTION DE RÉCOMPENSES ---------- */
.collection{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:620px){.collection{grid-template-columns:repeat(3,1fr)}}
.badge-carte{position:relative;border:1px solid var(--trait);border-radius:12px;padding:12px 10px;
  text-align:center;background:var(--ardoise2)}
.badge-carte .jeton{margin:0 auto 8px;width:42px;height:34px;font-size:11.5px}
.badge-carte .bt{font-size:12.5px;font-weight:600;line-height:1.25}
.badge-carte .bd{font-size:11px;color:var(--craie2);margin-top:4px;line-height:1.3}
.badge-carte.off{opacity:.5}
.badge-carte.off .bt{color:var(--craie2)}
.badge-carte .cadena{position:absolute;top:8px;right:8px;color:var(--craie2)}

/* ---------- MON COMPTE ---------- */
.profil .av{font-family:var(--d);font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--craie)}
.classement .t{display:flex;align-items:center;gap:7px}
.classement .rangbig{font-family:var(--d);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1;color:var(--craie)}
.classement .calcul{margin-top:14px;border-top:1px solid var(--or-bord);padding-top:11px}
.classement .calcul .l{font-family:var(--m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--craie2);margin-bottom:8px}
.classement .calcul .r{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;
  color:var(--craie2);padding:4px 0}
.classement .calcul .r b{color:var(--vert-texte);font-size:13.5px}
.classement .calcul .r b.neg{color:var(--rouge-texte)}
.coupure{font-family:var(--m);font-size:9.5px;letter-spacing:.1em;color:var(--craie2);text-align:center;padding:7px 0}
.jeton{width:34px;height:26px;flex:none;border-radius:7px;border:1px solid var(--trait);background:var(--ardoise2);
  display:grid;place-items:center;font-family:var(--m);font-size:10px;font-weight:600;color:var(--craie2);letter-spacing:.02em}
.jeton.gagne{background:var(--vert-plein);border-color:var(--vert-bord);color:var(--vert-texte)}
.grande .ic{display:grid;place-items:center;width:22px;color:var(--craie2)}
.badge{align-items:center}

.profil{display:flex;flex-direction:column;align-items:center;padding:18px 0 14px}
.profil .av{width:62px;height:62px;border-radius:50%;background:var(--ardoise2);border:1px solid var(--trait);
  display:grid;place-items:center;font-size:28px;margin-bottom:10px}
.profil h3{font-family:var(--d);font-weight:800;font-size:21px;letter-spacing:-.02em}
.profil span{font-family:var(--m);font-size:12px;color:var(--craie2);letter-spacing:.06em;margin-top:3px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--ardoise);border:1px solid var(--trait);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-family:var(--d);font-weight:800;font-size:24px;letter-spacing:-.03em}
.stat .l{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--craie2);margin-top:4px}
.classement{background:var(--or-fond);border:1px solid var(--or-bord);border-radius:14px;padding:15px;margin-top:10px}
.classement .t{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--or);margin-bottom:10px}
.classement .rangbig{font-family:var(--d);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
.classement .pts{font-family:var(--m);font-size:13.5px;color:var(--craie2);margin-top:5px}
.classement .up{font-family:var(--m);font-size:12.5px;color:var(--vert-texte);margin-top:3px}
.grande{display:flex;align-items:center;gap:11px;background:var(--ardoise);border:1px solid var(--trait);
  border-radius:13px;padding:14px;width:100%;text-align:left;margin-top:9px}
.grande:hover{border-color:var(--survol)}
.grande .ic{font-size:19px}
.grande b{display:block;font-size:14.5px;font-weight:600}
.grande span{display:block;font-size:12.5px;color:var(--craie2);margin-top:3px}
.grande .fl{margin-left:auto;color:var(--craie2);font-family:var(--m)}
.badge{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--trait);font-size:13.5px}
.badge:last-child{border-bottom:none}
.badge em{font-style:normal;color:var(--craie2);font-size:12px;display:block;margin-top:2px}
.badge.off{opacity:.4}
.semaine{display:flex;gap:6px;margin-top:11px}
.semaine div{flex:1;text-align:center}
.semaine .j{font-family:var(--m);font-size:10.5px;color:var(--craie2);margin-bottom:6px}
.semaine .c{height:30px;border-radius:7px;background:var(--trait);display:grid;place-items:center;font-size:13px}
.semaine .c.vert{background:var(--vert-plein);color:var(--vert-texte)}
.semaine .c.rouge{background:var(--rouge-plein);color:var(--rouge-texte)}
.reglages button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 0;
  border-bottom:1px solid var(--trait);font-size:14.5px;color:var(--craie2)}
.reglages button:last-child{border-bottom:none}
.reglages button span{font-family:var(--m);font-size:12px;color:var(--survol)}
.reglages button.sortie{color:var(--laterite)}


/* ---------- ACCESSIBILITÉ ---------- */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.vue:focus{outline:none}

/* ---------- EN-TÊTE D'APPLICATION ---------- */
.apptete{flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--trait);background:var(--barre)}
@media(min-width:860px){.apptete{padding:14px 24px}.apptete .mot{font-size:16px}}
.apptete .mot{font-family:var(--d);font-weight:800;font-size:14px;letter-spacing:.02em}
.apptete .mot i{font-style:normal;color:var(--laterite)}
.apptete .droite{margin-left:auto;font-family:var(--m);font-size:10px;letter-spacing:.06em;color:var(--craie2)}
.bouton-tete{display:flex;align-items:center;gap:6px;border:1px solid var(--trait);border-radius:9px;
  padding:6px 9px;font-size:11.5px;color:var(--craie2);white-space:nowrap;background:var(--ardoise)}
.bouton-tete:hover{border-color:var(--survol);color:var(--craie)}
.bouton-tete svg{display:block;flex:none}
.bouton-tete span{display:none}
@media(min-width:700px){.bouton-tete span{display:inline}}
@media(max-width:520px){.apptete .droite{display:none}}
.logo{flex:none;display:block}

/* ---------- SURCOUCHE ---------- */
.voile[hidden]{display:none !important}
.voile{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,12,10,.28);
  animation:voileIn .3s ease both;padding:16px}
body[data-theme="clair"] .voile{background:rgba(120,110,85,.18)}
@keyframes voileIn{from{opacity:0}to{opacity:1}}
.panneau{width:100%;max-width:460px;background:var(--encre);border:1px solid var(--trait);
  border-radius:20px;padding:20px 18px 18px;max-height:88vh;overflow-y:auto;
  box-shadow:var(--ombre);animation:monte .34s cubic-bezier(.2,.8,.3,1) both}
.panneau h3{font-family:var(--d);font-weight:800;font-size:23px;letter-spacing:-.025em;line-height:1.1}
.panneau .intro{font-size:13px;color:var(--craie2);line-height:1.5;margin:8px 0 16px}
.panneau .plustard{display:block;width:100%;text-align:center;margin-top:12px;font-size:12.5px;color:var(--craie2)}
.poignee{width:38px;height:4px;border-radius:2px;background:var(--trait);margin:0 auto 14px}
@media(min-width:860px){.voile{align-items:center}}

/* ---------- FORMULAIRES ---------- */
.champ{margin-bottom:12px}
.champ label{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--craie2);margin-bottom:6px}
.champ input,.champ select{width:100%;background:var(--ardoise);border:1px solid var(--trait);border-radius:11px;
  padding:13px 14px;color:var(--craie);font-family:var(--b);font-size:15px}
.champ input::placeholder{color:var(--craie2)}
.champ input:focus{outline:2px solid var(--cachet);outline-offset:1px;border-color:var(--cachet)}
.champ .aide{font-size:11px;color:var(--craie2);margin-top:5px;line-height:1.45}
.prefixe{display:flex;align-items:center;gap:0}
.prefixe .ind{font-family:var(--m);font-size:14px;color:var(--craie2);background:var(--ardoise2);border:1px solid var(--trait);
  border-right:none;border-radius:11px 0 0 11px;padding:13px 11px}
.prefixe input{border-radius:0 11px 11px 0}
.alerte{border:1px solid var(--laterite);background:var(--rouge-fond);border-radius:10px;padding:11px 13px;
  font-size:12.5px;color:var(--rouge-texte);margin-bottom:12px;line-height:1.45}
.lien{display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;color:var(--craie2);text-decoration:underline;text-underline-offset:3px}

/* ---------- ABONNEMENT ---------- */
.formule{border:1px solid var(--trait);border-radius:14px;padding:15px;margin-bottom:10px;background:var(--ardoise);
  width:100%;text-align:left;transition:.15s}
.formule:hover{border-color:var(--survol)}
.formule.on{border-color:var(--cachet);background:var(--vert-fond)}
.formule.reco{border-color:var(--or)}
.formule .haut{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.formule .nom{font-family:var(--d);font-weight:700;font-size:17px;letter-spacing:-.02em}
.formule .prix{font-family:var(--m);font-size:15px;color:var(--craie);white-space:nowrap}
.formule .prix em{font-style:normal;font-size:10px;color:var(--craie2)}
.formule ul{list-style:none;margin-top:10px}
.formule li{font-size:12.5px;color:var(--craie2);padding-left:16px;position:relative;margin-bottom:5px;line-height:1.4}
.formule li::before{content:'✓';position:absolute;left:0;color:var(--cachet);font-size:11px}
.formule li.non{color:var(--craie2)}
.formule li.non::before{content:'—';color:var(--survol)}
.ruban{display:inline-block;font-family:var(--m);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--or);color:var(--or-encre);padding:2px 7px;border-radius:4px;margin-bottom:8px}
.operateur{display:flex;align-items:center;gap:11px;border:1px solid var(--trait);border-radius:12px;
  padding:13px;margin-bottom:9px;width:100%;text-align:left;background:var(--ardoise)}
.operateur.on{border-color:var(--cachet);background:var(--vert-fond)}
.operateur .pastille{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:var(--d);
  font-weight:800;font-size:12px;flex:none}
.operateur .om{background:#FF6B00;color:#fff}
.operateur .mm{background:#0A4EA2;color:#fff}
.operateur .wv{background:#1DC8E0;color:#0A2A2E}
.operateur b{font-size:13.5px;display:block}
.operateur span{font-size:11.5px;color:var(--craie2)}
.ussd{background:var(--ardoise2);border:1px solid var(--trait);border-radius:12px;padding:18px;text-align:center;font-family:var(--m)}
.ussd .code{font-size:20px;letter-spacing:.06em;color:var(--craie);margin:10px 0}
.ussd p{font-size:11.5px;color:var(--craie2);line-height:1.6;font-family:var(--b)}
.attente{width:34px;height:34px;border:2px solid var(--trait);border-top-color:var(--cachet);border-radius:50%;
  margin:0 auto 14px;animation:tourne .9s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.verrou{opacity:.55;position:relative}
.verrou .cad{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px}
.echeance{font-family:var(--m);font-size:10.5px;letter-spacing:.05em;color:var(--craie2)}
.echeance.du{color:var(--rouge-texte)}


/* ---------- THÈME CLAIR ---------- */
body[data-theme="clair"]{
  --encre:#F3F0E8;          /* fond chaud, pas un blanc d'imprimante */
  --ardoise:#FFFDFA;        /* cartes, très légèrement crème */
  --ardoise2:#EDE8DC;
  --trait:#E0D9C9;
  --craie:#191D18;
  --craie2:#635E52;
  --barre:#FFFDFA;
  --survol:#B9AF9C;
  --laterite:#A8401E;
  --cachet:#0A6141;
  --or:#8A6510;
  --vert-fond:#E6F2EB; --vert-bord:#A6D2BC; --vert-texte:#0A6141; --vert-plein:#CFE8DB;
  --rouge-fond:#FAEAE3; --rouge-bord:#E5B9A5; --rouge-texte:#9E3A19; --rouge-plein:#F2D6C9;
  --ambre-fond:#FAF1DB; --ambre-bord:#DCC689; --ambre-texte:#755509;
  --or-fond:#FBF6EA; --or-texte:#5A4614; --or-bord:#DFCFA6; --or-encre:#FFFFFF;
  --papier:#F6F1E4; --papier2:#EBE4D2; --papier-trait:#D4CAB1;
  --ombre:0 20px 50px -22px rgba(60,50,30,.35);
}
/* profondeur douce : les cartes se détachent par l'ombre, pas par un trait dur */
body[data-theme="clair"] .carte,
body[data-theme="clair"] .cours,
body[data-theme="clair"] .fascicule,
body[data-theme="clair"] .stat,
body[data-theme="clair"] .grande,
body[data-theme="clair"] .formule,
body[data-theme="clair"] .operateur,
body[data-theme="clair"] .err,
body[data-theme="clair"] .theme-carte,
body[data-theme="clair"] .compteur-place{border-color:#E8E2D4;box-shadow:0 1px 2px rgba(70,60,40,.05),0 8px 20px -14px rgba(70,60,40,.18)}
body[data-theme="clair"] .apptete{background:var(--barre);border-bottom-color:#E6E0D2;
  box-shadow:0 1px 0 rgba(70,60,40,.05)}
body[data-theme="clair"] .nav{background:var(--barre);border-top-color:#E6E0D2}
body[data-theme="clair"] .rail{background:#F7F4EC;border-right-color:#E6E0D2}
body[data-theme="clair"] .rail button:hover{background:#FFFDFA}
body[data-theme="clair"] .rail button.on{background:#FFFDFA;box-shadow:0 1px 2px rgba(70,60,40,.06)}
body[data-theme="clair"] .nav button{color:#7C7768}
body[data-theme="clair"] .nav button.on{color:var(--craie)}
body[data-theme="clair"] .bouton-tete{background:#FFFDFA;border-color:#E0D9C9}

body[data-theme="clair"] .cta:not(.creux){color:#fff;box-shadow:0 6px 16px -8px rgba(168,64,30,.6)}
body[data-theme="clair"] .cta.creux{color:var(--craie);border-color:var(--survol);background:#FFFDFA}
body[data-theme="clair"] .cta.creux small{color:var(--craie2)}
body[data-theme="clair"] .cta.vert{box-shadow:0 6px 16px -8px rgba(10,97,65,.55)}

body[data-theme="clair"] .classement{background:linear-gradient(165deg,#FDF8EC,#F6EFDD);border-color:#E3D3A9}
body[data-theme="clair"] .classement .calcul{border-top-color:#E3D3A9}
body[data-theme="clair"] .rang.moi{background:#FFFDFA}
body[data-theme="clair"] .rang .av{background:var(--ardoise2)}

body[data-theme="clair"] .champ input{background:#FFFDFA}
body[data-theme="clair"] .semaine .c{background:var(--ardoise2)}
body[data-theme="clair"] .jeton{background:var(--ardoise2)}
body[data-theme="clair"] .ussd{background:#FFFDFA;border-color:#E0D9C9}
body[data-theme="clair"] .ussd .code{color:var(--craie)}
body[data-theme="clair"] .cachet-note{background:var(--rouge-fond)}
body[data-theme="clair"] .cachet-note.admis{background:var(--vert-fond)}
body[data-theme="clair"] .ruban{color:#fff;background:#8A6510}
body[data-theme="clair"] .operateur .wv{color:#08272B}
body[data-theme="clair"] .jauge{background:var(--ardoise2)}
body[data-theme="clair"] .acquis i{background:var(--ardoise2)}
body[data-theme="clair"] .progression i{background:var(--ardoise2)}
body[data-theme="clair"] .voile{background:rgba(60,52,36,.22)}
body[data-theme="clair"] .panneau{background:#FFFDFA}
body[data-theme="clair"] .vue::-webkit-scrollbar-thumb{background:#DCD5C4}

/* la feuille de composition reste du papier dans les deux thèmes */
body[data-theme="clair"] .gr-tete{background:#26241D}
body[data-theme="clair"] .gr-q,
body[data-theme="clair"] .feuille{background:#FFFDF7}
body[data-theme="clair"] .bulle,
body[data-theme="clair"] .pastille-op{background:#fff;border-color:#9C927C;color:#6B6350}
body[data-theme="clair"] .bulle.noirci,
body[data-theme="clair"] .pastille-op.noirci{background:#221F17;border-color:#221F17;color:#FBF7EA}
body[data-theme="clair"] .rep:hover{background:#F5EFE0}
body[data-theme="clair"] .gr-q .no{background:#3A342A}

.theme-carte{border:1px solid var(--trait);border-radius:14px;padding:16px;margin-bottom:11px;width:100%;text-align:left;background:var(--ardoise)}
.theme-carte.on{border-color:var(--cachet);background:var(--vert-fond)}
body[data-theme="clair"] .theme-carte.on{background:#E9F5EF}
.theme-carte .demo{height:52px;border-radius:9px;margin-bottom:11px;display:flex;overflow:hidden;border:1px solid var(--trait)}
.theme-carte .demo i{flex:1}
.theme-carte b{display:block;font-size:14.5px;font-weight:600}
.theme-carte span{font-size:12px;color:var(--craie2)}
.theme-carte .coche{float:right;font-family:var(--m);font-size:11px;color:var(--cachet)}
body.en-transition,
body.en-transition *{transition:background-color .4s ease, color .4s ease, border-color .4s ease, fill .4s ease !important}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

const $ = s => document.querySelector(s);
const vue = () => $('#vue');
let audioCtx = null;
function ctx(){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  catch(e){ return null; }
}
function ton(freq, depart, duree, volume, forme){
  const a = ctx(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + depart;
  o.type = forme || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(volume, t + 0.018);
  g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + duree + 0.02);
}
function bip(fois){
  for(let k=0;k<fois;k++) ton(880, k*0.42, 0.32, 0.22);
}
function sonJuste(){
  ton(523.25, 0, 0.22, 0.15);
  ton(659.25, 0.085, 0.22, 0.15);
  ton(783.99, 0.17, 0.26, 0.15);
}
function sonFaux(){
  const a = ctx(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime;
  o.type = 'triangle';
  o.frequency.setValueAtTime(330, t);
  o.frequency.exponentialRampToValueAtTime(175, t + 0.24);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + 0.32);
}
function annonceTemps(txt){
  const z = document.getElementById('sonnerie');
  if(!z) return;
  z.textContent = txt; z.classList.add('vu');
  clearTimeout(z._t);
  z._t = setTimeout(()=>z.classList.remove('vu'), 4000);
}
const mmss = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const PALIERS = [3, 7, 21];               // jours entre deux reprises
const JOUR = 86400000;
const aujourdhuiZero = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
function joursRestants(e){
  if(e.revoirLe === undefined) return 0;
  return Math.max(0, Math.round((e.revoirLe - aujourdhuiZero())/JOUR));
}
function programmer(e, juste){
  if(juste){
    e.suite++;
    e.revoirLe = aujourdhuiZero() + (PALIERS[Math.min(e.suite-1, PALIERS.length-1)] * JOUR);
  } else {
    e.suite = 0; e.rate++;
    e.revoirLe = aujourdhuiZero();       // à reprendre aujourd'hui même
  }
}
const ouvertes = () => S.cahier.filter(e => e.suite < 3).length;
const dues = () => S.cahier.filter(e => e.suite < 3 && joursRestants(e) === 0).length;
const aReprendre = () => S.cahier.filter(e => e.suite < 3);

          </div>
        </div>`;
      }).join('')}
    </div>

      <div class="compte"><span>${rep} sur 10 traitées</span><span>un cercle noirci est définitif</span></div>
      <button class="remettre" data-tremettre="1">Remettre ma copie</button>
    </div>
  </div>`;
  if(!S.testTimer && !S.testCorrige){
    S.testTimer = setInterval(()=>{
      S.testChrono--;
      const c = document.getElementById('tchrono');
      if(c){ c.textContent = mmss(S.testChrono); if(S.testChrono<=30) c.classList.add('chaud'); }
      if(S.testChrono===60){ bip(1); annonceTemps('Il reste 1 minute'); }
      if(S.testChrono===30){ bip(3); annonceTemps('Plus que 30 secondes'); }
      if(S.testChrono<=0){ clearInterval(S.testTimer); S.testTimer=null; bip(4); remettreTest(); }
    },1000);
  }
}
function remettreTest(){
  if(S.testTimer){clearInterval(S.testTimer);S.testTimer=null;}
  S.testCorrige = true;
  let n=0; TEST.forEach((g,i)=>{ const r=S.testRep[i]||[]; if(r.length===1 && r[0]===g.i) n++; });
  S.testNote = n;
  // les fautes du test ouvrent le cahier
  TEST.forEach((g,i)=>{
    const r = S.testRep[i] || [];
    const juste = r.length===1 && r[0]===g.i;
    if(r.length && !juste && !S.cahier.some(e=>e.q===g.q))
      S.cahier.push({q:g.q, mien:r.map(x=>g.o[x]).join(' + '), bon:g.o[g.i], opts:g.o, i:g.i, rate:1, suite:0, revoirLe:0, session:0,
        note:'Ratée au test d\'entrée. Elle ouvre ton cahier : elle reviendra jusqu\'à être acquise.'});
  });
  ecranTest();
  const corps = document.getElementById('tcorps');
  if(corps){
    const s=document.createElement('div'); s.className='scan'; corps.appendChild(s);
    setTimeout(()=>{ s.remove(); aller('resultat'); }, 1600);
  }
}

function bilanDomaines(){
  const m = {};
  TEST.forEach((g,i)=>{
    m[g.d] = m[g.d] || {j:0,f:0,n:0};
    m[g.d].n++;
    const r = S.testRep[i] || [];
    if(r.length===1 && r[0]===g.i) m[g.d].j++; else m[g.d].f++;
  });
  return m;
}

/* --- curseur de navigation rapide --- */
function brancherScrub(){
  const zone = document.getElementById('scrub');
  const main = document.getElementById('poignee');
  const corps = document.getElementById('corps');
  const bulle = document.getElementById('bulleQ');
  if(!zone || !main || !corps) return;
  const total = S.grille.length;

  const placer = (ratio)=>{
    const h = zone.clientHeight - main.offsetHeight;
    main.style.top = Math.round(ratio * h) + 'px';
    if(bulle) bulle.textContent = 'Question ' + Math.min(total, Math.max(1, Math.round(ratio*(total-1))+1));
  };
  const depuisScroll = ()=>{
    const max = corps.scrollHeight - corps.clientHeight;
    placer(max>0 ? corps.scrollTop/max : 0);
  };
  corps.addEventListener('scroll', depuisScroll);
  depuisScroll();

  let actif = false;
  const bouger = (clientY)=>{
    const r = zone.getBoundingClientRect();
    const h = zone.clientHeight - main.offsetHeight;
    let y = clientY - r.top - main.offsetHeight/2;
    y = Math.max(0, Math.min(h, y));
    const ratio = h>0 ? y/h : 0;
    placer(ratio);
    corps.scrollTop = ratio * (corps.scrollHeight - corps.clientHeight);
  };
  const debut = e=>{
    actif = true; zone.classList.add('actif');
    if(navigator.vibrate) navigator.vibrate(8);
    bouger(e.clientY);
    e.preventDefault(); e.stopPropagation();
  };
  zone.addEventListener('pointerdown', debut);
  zone.addEventListener('touchstart', e=>{ if(e.touches[0]) debut({clientY:e.touches[0].clientY, preventDefault:()=>e.preventDefault(), stopPropagation:()=>e.stopPropagation()}); }, {passive:false});

  const suivre = e=>{ if(actif) bouger(e.clientY); };
  const suivreTactile = e=>{ if(actif && e.touches[0]){ bouger(e.touches[0].clientY); e.preventDefault(); } };
  const fin = ()=>{ if(!actif) return; actif=false; zone.classList.remove('actif'); };

  window.addEventListener('pointermove', suivre);
  window.addEventListener('touchmove', suivreTactile, {passive:false});
  window.addEventListener('pointerup', fin);
  window.addEventListener('pointercancel', fin);
  window.addEventListener('touchend', fin);
}

document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-apercu],[data-saut],[data-compotab],[data-bascule-theme],[data-modal],[data-entrer],[data-bascule],[data-plustard],[data-deconnecter],[data-theme-choix],[data-erreursdusoir],[data-cible],[data-cours],[data-inscrire],[data-connecter],[data-oubli],[data-formule],[data-operateur],[data-payer],[data-paiefin],[data-paieannul],[data-go],[data-toutcahier],[data-actu],[data-niv],[data-mat],[data-qcm],[data-qsuiv],[data-cahierfreq],[data-classement],[data-diagnostic],[data-defi],[data-duel],[data-badges],[data-phase],[data-conc],[data-dep],[data-test],[data-tb],[data-tremettre],[data-retest],[data-seance],[data-rep],[data-suivante],[data-b],[data-remettre],[data-recommencer],[data-reprise],[data-rr],[data-fin-reprise]');
  if(!t) return;
  const d = t.dataset;

  if(d.go){ if(d.go==='paiement') S.paieEtape=0; S.erreur=''; return aller(d.go); }

  if(d.inscrire){
    const f = S.form, tel = f.tel.replace(/\D/g,''), pin = f.pin.replace(/\D/g,'');
    if(f.nom.trim().length < 3) S.erreur = "Écris ton nom et ton prénom.";
    else if(tel.length !== 8) S.erreur = "Le numéro doit comporter 8 chiffres.";
    else if(pin.length !== 4) S.erreur = "Le code secret doit comporter 4 chiffres.";
    else {
      S.erreur=''; S.util = {nom:f.nom.trim(), tel:tel, pin:pin, connecte:true};
      S.modal = null;
      return aller('aujourdhui');
    }
    return rendre();
  }
  if(d.connecter){
    const tel = S.form.tel.replace(/\D/g,''), pin = S.form.pin.replace(/\D/g,'');
    if(tel.length !== 8 || pin.length !== 4){ S.erreur = "Numéro à 8 chiffres et code à 4 chiffres."; return rendre(); }
    S.erreur=''; S.util.connecte = true; S.util.tel = tel;
    if(!S.util.nom) S.util.nom = 'Candidat';
    S.modal = null;
    return aller('aujourdhui');
  }
  if(d.oubli){ S.erreur = "Un code provisoire a été envoyé par SMS au numéro saisi."; return rendre(); }
  if(d.formule){ S.choixFormule = d.formule; return rendre(); }
  if(d.operateur){ S.operateur = d.operateur; return rendre(); }
  if(d.payer){
    const tel = S.paieTel.replace(/\D/g,'');
    if(tel.length !== 8){ S.erreur = "Saisis le numéro mobile money à 8 chiffres."; return rendre(); }
    S.erreur=''; S.paieEtape = 1; return rendre();
  }
  if(d.paiefin){
    S.paieEtape = 2;
    S.abo = {actif:true, formule:FORMULES[S.choixFormule].n, echeance:'25 août'};
    return rendre();
  }
  if(d.paieannul){ S.paieEtape = 0; return aller('abonnement'); }
  if(d.erreursdusoir){ S.cahierDepuisGrille = true; S.cahierFiltre=false; return aller('cahier'); }
  if(d.entrer){
    aller('aujourdhui');
    if(!S.modalDejaVu && !S.util.connecte){
      clearTimeout(S.minuteur);
      S.minuteur = setTimeout(()=>{ if(!S.util.connecte){ S.modal='inscription'; S.modalDejaVu=true; surcouche(); } }, 6000);
    }
    return;
  }
  if(d.bascule){ S.modal = d.bascule; S.erreur=''; return surcouche(); }
  if(d.plustard){ S.modal = null; S.erreur=''; return surcouche(); }
  if(d.toutcahier){ S.cahierFiltre=false; S.cahierDepuisGrille=false; return rendre(); }
  if(d.actu){ S.actuOnglet = d.actu; return rendre(); }
  if(d.niv){ S.niveau = d.niv; return rendre(); }
  if(d.mat){ S.matiere = d.mat; S.qcmIdx=0; S.qcmRep=undefined; S.qcmSerie=0; S.ecran='qcm'; return rendre(); }
  if(d.qcm !== undefined){
    const b = QCM[S.matiere] || QCM['Culture générale'];
    const q = b[S.qcmIdx % b.length];
    S.qcmRep = +d.qcm; S.qcmSerie++;
    if(+d.qcm===q.i){ S.qcmJustes++; S.score = Math.min(100, S.score); sonJuste(); }
    else {
      sonFaux();
      if(!S.cahier.some(e=>e.q===q.q))
        S.cahier.push({q:q.q, mien:q.o[+d.qcm], bon:q.o[q.i], opts:q.o, i:q.i, rate:1, suite:0, revoirLe:0, session:0, note:q.x});
    }
    return ecranQcm();
  }
  if(d.qsuiv){ S.qcmIdx++; S.qcmRep=undefined; return ecranQcm(); }
  if(d.cahierfreq){ S.cahierFiltre=true; S.taches[2]=true; return aller('cahier'); }
  if(d.classement){ S.voirClassement = !S.voirClassement; return rendre(); }
  if(d.diagnostic){ S.voirDiagnostic = !S.voirDiagnostic; return rendre(); }
  if(d.defi){ S.voirDefi = !S.voirDefi; return rendre(); }
  if(d.cours){ return; }
  if(d.duel){ alert('Recherche d\'un adversaire de niveau proche…'); return; }
  if(d.badges){ S.voirBadges = !S.voirBadges; return rendre(); }
  if(d.themeChoix){
    if(d.themeChoix===S.theme) return;
    document.body.classList.add('en-transition');
    S.theme = d.themeChoix; rendre();
    clearTimeout(S.tTheme);
    S.tTheme = setTimeout(()=>document.body.classList.remove('en-transition'), 480);
    return;
  }
  if(d.basculeTheme){ return basculerTheme(); }
  if(d.modal){ S.modal = d.modal; S.erreur=''; return surcouche(); }
  if(d.deconnecter){
    S.util = {nom:'', tel:'', pin:'', connecte:false};
    S.form = {nom:'', tel:'', pin:''};
    return aller('engagement');
  }
  if(d.cible){ S.matiere = d.cible; S.qcmIdx=0; S.qcmRep=undefined; S.qcmSerie=0; return aller('qcm'); }
  if(d.phase){ S.phase = +d.phase; return rendre(); }
  if(d.conc !== undefined){ S.concours = CONCOURS[+d.conc][0]; S.phase = 2; return rendre(); }
  if(d.dep !== undefined){ S.semaines = DEPART[+d.dep][2]; S.ecran='testIntro'; return rendre(); }
  if(d.test){ S.ecran='test'; return rendre(); }
  if(d.tb && !S.testCorrige){
    const [q,i] = d.tb.split('-').map(Number);
    const l = S.testRep[q] || [];
    if(l.includes(i)) return;              // définitif
    S.testRep[q] = [...l, i].sort();
    return ecranTest();
  }
  if(d.tremettre) return remettreTest();
  if(d.retest){
    S.testRep={}; S.testCorrige=false; S.testChrono=120; S.testNote=null;
    S.cahier = S.cahier.filter(e=>!TEST.some(t=>t.q===e.q));
    return aller('test');
  }

  if(d.seance){ S.ecran='seance'; S.seanceIdx=0; S.seanceJustes=0; return rendre(); }

  if(d.rep !== undefined){
    const i = +d.rep, q = S.seance[S.seanceIdx];
    if(i===q.i){ S.seanceJustes++; sonJuste(); } else sonFaux();
    if(i!==q.i && !S.cahier.some(e=>e.q===q.q))
      S.cahier.push({q:q.q, mien:q.opts[i], bon:q.opts[q.i], opts:q.opts, i:q.i, rate:1, suite:0, revoirLe:0, session:0, note:q.note});
    return ecranSeance(i), nav();
  }

  if(d.suivante){
    S.seanceIdx++;
    if(S.seanceIdx >= S.seance.length){ S.etapes[1]=true; return ecranSeanceFin(), nav(); }
    return ecranSeance(undefined);
  }

  if(d.compotab){
    S.compoTab = d.compotab;
    if(d.compotab==='sujet') S.sujetVu = true;
    ecranGrille();
    const c = document.getElementById('corps'); if(c) c.scrollTop = 0;
    return;
  }
  if(d.apercu !== undefined){
    S.apercu = (d.apercu==='fermer' || String(S.apercu)===d.apercu) ? null : +d.apercu;
    return ecranGrille();
  }
  if(d.saut){
    const el = document.getElementById('q'+d.saut);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if(d.b && !S.corrige){
    const [q,i] = d.b.split('-').map(Number);
    const l = S.reponses[q] || [];
    if(l.includes(i)) return;              // définitif : pas de retour en arrière
    S.reponses[q] = [...l, i].sort();
    return ecranGrille();
  }

  if(d.remettre) return remettre();

  if(d.recommencer){
    S.reponses={}; S.corrige=false; S.chrono=1500; S.grilleNote=null; S.compoTab='feuille'; S.sujetVu=false; S.apercu=null; return aller('grille');
  }

  if(d.reprise !== undefined){ repriseIdx=+d.reprise; repriseRep=undefined; return rendre(); }

  if(d.rr !== undefined){
    const i = +d.rr, e = S.cahier[repriseIdx];
    repriseRep = i;
    if(i===e.i) sonJuste(); else sonFaux();
    programmer(e, i===e.i);
    if(i===e.i && e.suite>=3) S.score = Math.min(100,S.score+1);
    return ecranReprise(), nav();
  }

  if(d.fin_reprise || d.finReprise){
    repriseIdx=null; repriseRep=undefined;
    if(!aReprendre().length) S.etapes[2]=true;
    return rendre();
  }
});

rendre();
</script>
