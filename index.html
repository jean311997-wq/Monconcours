<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1513">
<title>Mon Concours</title>

<!-- la mise en forme d'abord : c'est elle qui décide de la vitesse perçue -->
<link rel="stylesheet" href="styles.css">

<!-- les polices ne bloquent plus l'affichage : le texte s'affiche tout de suite -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preload" as="style"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"
  onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"></noscript>
</head>
<body>

<div class="app">
  <header class="apptete" id="apptete"></header>
  <aside class="rail" id="rail" aria-label="Navigation principale"></aside>
  <main class="vue" id="vue" tabindex="-1" role="main"></main>
  <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  <div class="voile" id="voile" hidden></div>
</div>
<div class="sr" id="annonce" aria-live="polite" role="status"></div>

<!-- l'application s'affiche immédiatement, sans attendre le réseau -->
<script src="app.js"></script>

<!-- la base est chargée après le premier affichage : elle ne retarde plus rien -->
<script>
(function(){
  var adresses = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2',
    'https://cdn.skypack.dev/@supabase/supabase-js@2'
  ];
  function essayer(i){
    if(i >= adresses.length) return;
    var s = document.createElement('script');
    s.src = adresses[i];
    s.async = true;
    s.onload = function(){
      if(window.supabase && typeof brancherBase === 'function') brancherBase();
      else essayer(i + 1);
    };
    s.onerror = function(){ essayer(i + 1); };
    document.body.appendChild(s);
  }
  if(document.readyState === 'complete') essayer(0);
  else window.addEventListener('load', function(){ setTimeout(function(){ essayer(0); }, 60); });
})();
</script>
</body>
</html>
