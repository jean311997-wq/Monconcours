<style>
  #facade{position:fixed;inset:0;z-index:900;background:#0F1513;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:10px;
    font-family:system-ui,-apple-system,sans-serif;transition:opacity .28s ease}
  #facade b{color:#EFE9DA;font-size:15px;letter-spacing:.22em}
  #facade i{color:#8A9490;font-size:12px;font-style:normal;text-align:center;padding:0 24px}
  #facade u{display:block;width:120px;height:2px;margin-top:8px;border-radius:2px;
    background:#1E2A26;overflow:hidden;position:relative;text-decoration:none}
  #facade u::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;
    background:#C4552E;animation:facadeGlisse 1.05s ease-in-out infinite}
  @keyframes facadeGlisse{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #facade.parti{opacity:0;pointer-events:none}
  #facade .secours{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:22px}
  #facade.perdu .secours{display:flex}
  #facade.perdu u{display:none}
  #facade .secours p{color:#8A9490;font-size:12.5px;text-align:center;margin:0;padding:0 30px;line-height:1.5}
  #facade .secours button{font:inherit;font-size:14px;font-weight:600;padding:12px 26px;border-radius:999px;
    border:1px solid #C4552E;background:#C4552E;color:#fff;cursor:pointer}
  #facade .secours button.b2{background:transparent;color:#EFE9DA;border-color:#2A3A34}
</style>

<div id="facade" aria-hidden="true">
  <svg width="62" height="62" viewBox="0 0 64 64">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EADB"/><stop offset="1" stop-color="#DED3BE"/></linearGradient></defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fg)"/>
    <circle cx="22" cy="22" r="10.4" fill="#FBFAF7" stroke="#C9BEA9"/>
    <circle cx="42" cy="22" r="10.4" fill="#1C1C1C"/>
    <circle cx="22" cy="42" r="10.4" fill="#1C1C1C"/>
    <circle cx="42" cy="42" r="10.4" fill="#FBFAF7" stroke="#C9BEA9"/>
  </svg>
  <b>MON CONCOURS</b>
  <i>Progresser vers l'obtention de votre concours</i>
  <u></u>
  <div class="secours">
    <p>Le chargement prend plus de temps que prévu. Votre connexion est peut-être faible, ou une ancienne version est restée en mémoire.</p>
    <button onclick="reparerEtRecharger()">Réparer et recharger</button>
    <button class="b2" onclick="document.getElementById('facade').classList.add('parti')">Continuer quand même</button>
  </div>
</div>

<script>
/* FILET DE SÉCURITÉ — indépendant de app.js.
   Si l'application n'a rien dessiné au bout de huit secondes, on ne
   laisse jamais le candidat devant un logo figé : on lui donne une
   sortie. Ce script ne dépend d'aucun autre fichier. */
(function(){
  var f = document.getElementById('facade');
  if(!f) return;
  setTimeout(function(){
    if(!f.parentNode) return;
    var vue = document.getElementById('vue');
    if(vue && vue.innerHTML.length > 80){ f.classList.add('parti'); return; }
    f.classList.add('perdu');
  }, 6000);
})();

function facadePerdue(){
  var f = document.getElementById('facade');
  if(f) f.classList.add('perdu');
}

/* Vide le cache, retire les anciens service workers, puis recharge. */
function reparerEtRecharger(){
  var fini = function(){ location.reload(true); };
  try{
    var taches = [];
    if(window.caches && caches.keys)
      taches.push(caches.keys().then(function(k){
        return Promise.all(k.map(function(n){ return caches.delete(n); }));
      }));
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      taches.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    if(!taches.length) return fini();
    Promise.all(taches).then(fini).catch(fini);
    setTimeout(fini, 3000);
  }catch(e){ fini(); }
}
</script>

<div class="app">
  <header class="apptete" id="apptete"></header>
  <aside class="rail" id="rail" aria-label="Navigation principale"></aside>
  <main class="vue" id="vue" tabindex="-1" role="main"></main>
  <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  <div class="voile" id="voile" hidden></div>
</div>
<div class="sr" id="annonce" aria-live="polite" role="status"></div>

<!-- l'application s'affiche immédiatement, sans attendre le réseau -->
<script src="app.js?v=11" onerror="facadePerdue()"></script>

<!-- la base est servie par le site : un domaine de moins à joindre en 2G -->
<script>
(function(){
  function brancher(){
    if(window.supabase && typeof brancherBase === 'function') brancherBase();
  }
  var s = document.createElement('script');
  s.src = '/supabase-js.min.js?v=11';
  s.async = true;
  s.onload = brancher;
  s.onerror = function(){
    /* secours : si le fichier local manque, on retombe sur les CDN */
    var adresses = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
                    'https://unpkg.com/@supabase/supabase-js@2'];
    (function essayer(i){
      if(i >= adresses.length) return;
      var t = document.createElement('script');
      t.src = adresses[i]; t.async = true;
      t.onload = brancher;
      t.onerror = function(){ essayer(i + 1); };
      document.body.appendChild(t);
    })(0);
  };
  function lancer(){ document.body.appendChild(s); }
  if(document.readyState === 'complete') lancer();
  else window.addEventListener('load', function(){ setTimeout(lancer, 60); });
})();
</script>

<!-- ouverture immédiate aux visites suivantes, et lecture sans réseau -->
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    setTimeout(function(){
      var recharge = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(recharge) return; recharge = true; window.location.reload();
      });
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        /* une version neuve prend la main sans attendre */
        reg.addEventListener('updatefound', function(){
          var neuf = reg.installing;
          if(!neuf) return;
          neuf.addEventListener('statechange', function(){
            if(neuf.state === 'installed' && navigator.serviceWorker.controller) neuf.postMessage({type:'active'});
          });
        });
      }).catch(function(){});
    }, 1500);
  });
}
</script>
