<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Espace partenaire · Mon Concours</title>
<link rel="icon" href="/favicon.png">
<style>
  :root{--fond:#0C1512;--carte:#14211C;--trait:#26372F;--texte:#E9EEEA;--doux:#A2B2AA;--or:#E3A82B;--vert:#4FC28F;--bouton:#13805A;--rouge:#E5736B}
  @media (prefers-color-scheme: light){:root{--fond:#F6F3EC;--carte:#FFFFFF;--trait:#E2DCCD;--texte:#1B1F1D;--doux:#5A645F;--or:#9A6B07;--vert:#0E7A54;--bouton:#13805A;--rouge:#B3382F}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:22px 16px 70px}
  .marque{font-weight:800;letter-spacing:.04em;color:var(--or);font-size:14px}
  h1{font-size:25px;line-height:1.25;margin:14px 0 4px}
  h2{font-size:17px;margin:28px 0 10px}
  .doux{color:var(--doux);font-size:14px}
  .carte{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:14px 16px;margin:12px 0}
  .code{font-size:34px;font-weight:800;letter-spacing:.12em;color:var(--or);margin:2px 0 10px}
  .lien{word-break:break-all;font-size:14px;color:var(--doux);margin:0 0 10px}
  .rang{display:flex;flex-wrap:wrap;gap:8px}
  button,.bouton{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:10px 14px;background:var(--bouton);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  button.creux,.bouton.creux{background:transparent;color:var(--texte);border:1px solid var(--trait)}
  .tuiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  @media (min-width:640px){.tuiles{grid-template-columns:repeat(3,1fr)}}
  .tuile{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px}
  .tuile b{display:block;font-size:26px;line-height:1.1}
  .tuile span{color:var(--doux);font-size:13px}
  .bareme td,.bareme th{padding:10px 4px}
  .bareme td b{font-size:19px;color:var(--vert)}
  .exemple{margin:12px 0 0;padding:10px 12px;border-radius:10px;border:1px dashed var(--trait);font-size:14.5px}
  .argent{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .argent .tuile b{font-size:21px}
  .filtres{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .filtres button{background:transparent;color:var(--texte);border:1px solid var(--trait);font-weight:600;font-size:14px;padding:7px 12px}
  .filtres button.on{background:var(--bouton);border-color:var(--bouton);color:#fff}
  .fil{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .fil b{font-size:16px}
  .badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--trait);white-space:nowrap}
  .badge.paye{background:var(--bouton);border-color:var(--bouton);color:#fff}
  .badge.voulu{color:var(--or);border-color:var(--or)}
  .badge.non{color:var(--rouge);border-color:var(--rouge)}
  .ligne{color:var(--doux);font-size:13.5px;margin:4px 0 0}
  .contact{margin-top:8px}
  .contact a{display:inline-block;margin-right:12px;color:var(--vert);font-weight:700;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--trait)}
  td.n,th.n{text-align:right}
  .vide{color:var(--doux);padding:10px 0}
  .regles li{margin:5px 0;color:var(--doux);font-size:14px}
  .erreur{background:var(--carte);border:1px solid var(--rouge);border-radius:14px;padding:16px;margin-top:30px}
  .petit{font-size:12.5px;color:var(--doux)}

  h2{scroll-margin-top:12px}
  html{scroll-behavior:smooth}
  .ancres{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .ancres a{font-size:13.5px;font-weight:700;color:var(--vert);text-decoration:none;border:1px solid var(--trait);border-radius:99px;padding:6px 12px}
  .nouveau{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--bouton);color:#fff;font-weight:600;font-size:14.5px}
  .nouveau a{color:#fff;text-decoration:underline;margin-left:6px}
  .palier{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--trait)}
  .palier .coche{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--trait);display:grid;place-items:center;font-weight:800;font-size:14px}
  .palier.ok .coche{background:var(--bouton);border-color:var(--bouton);color:#fff}
  .progres{height:10px;border-radius:99px;background:var(--trait);margin-top:12px;overflow:hidden}
  .progres i{display:block;height:100%;background:var(--or);border-radius:99px}
  .semaines td,.semaines th{padding:6px 4px;font-size:13.5px}
  .barre{position:relative;height:22px;background:var(--trait);border-radius:6px;overflow:hidden;min-width:64px}
  .barre i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .barre i.v{background:#8aa39a}.barre i.i{background:var(--or)}.barre i.p{background:var(--bouton)}
  .barre span{position:relative;z-index:1;padding:0 6px;font-weight:700;font-size:12.5px;line-height:22px}
  .nouvelle{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--trait);font-size:14.5px}
  .nouvelle:last-child{border-bottom:0}
  .nouvelle .petit{flex:none;width:92px}
  .nouvelle.neuve{background:rgba(19,128,90,.10);border-radius:8px;padding-left:6px}
  .msg{white-space:pre-wrap;font:inherit;font-size:14.5px;background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;margin:8px 0 10px}
  .visuels{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:640px){.visuels{grid-template-columns:repeat(2,1fr)}}
  .cadre canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--trait);margin-top:8px;display:block}
  details{border-bottom:1px solid var(--trait);padding:8px 0}
  details:last-child{border-bottom:0}
  summary{cursor:pointer;font-weight:700;font-size:15px}
  details p{margin:8px 0 2px;color:var(--doux);font-size:14.5px}
  details.plie{margin-top:12px;border:0}
  .faq{padding-top:6px;padding-bottom:6px}
</style>
</head>
<body>
<main>
  <div class="marque">MON CONCOURS · ESPACE PARTENAIRE</div>
  <div id="zone"><p class="doux">Chargement…</p></div>
</main>
<script src="/supabase-js.min.js?v=13"></script>
<script src="partenaire.js?v=6"></script>
</body>
</html>
